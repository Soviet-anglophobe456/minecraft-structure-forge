name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows one-file build
    runs-on: windows-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify required source files
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "main.py" -PathType Leaf)) {
            throw "main.py is missing from the repository root."
          }
          if (-not (Test-Path -LiteralPath "icon.ico" -PathType Leaf)) {
            throw "icon.ico is missing from the repository root."
          }

      - name: Install application and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install PyInstaller==6.21.0

      - name: Validate ICO layers
        shell: pwsh
        run: |
          python -c "from PIL import Image; image=Image.open('icon.ico'); sizes=set(image.ico.sizes()); required={(16,16),(32,32),(48,48),(256,256)}; missing=required-sizes; assert image.format=='ICO', 'icon.ico is not a valid ICO file'; assert not missing, f'Missing ICO layers: {sorted(missing)}'; print('ICO layers:', sorted(sizes))"

      - name: Build Minecraft Structure Forge
        shell: pwsh
        run: |
          # --icon embeds the icon in the Windows PE executable.
          # --add-data bundles the same file for resource_path("icon.ico") at runtime.
          python -m PyInstaller `
            --onefile `
            --windowed `
            --name "MinecraftStructureForge" `
            --noconfirm `
            --clean `
            --icon="icon.ico" `
            --add-data "icon.ico;." `
            --collect-all "tkinterdnd2" `
            --collect-all "pyglet" `
            --collect-submodules "OpenGL" `
            --hidden-import "PIL.ImageTk" `
            "main.py"

      - name: Verify embedded and bundled icons
        shell: pwsh
        run: |
          python -c "import pefile; from PyInstaller.archive.readers import CArchiveReader; path='dist/MinecraftStructureForge.exe'; pe=pefile.PE(path); ids={entry.id for entry in pe.DIRECTORY_ENTRY_RESOURCE.entries if entry.id is not None}; assert 3 in ids, 'RT_ICON is missing from the EXE'; assert 14 in ids, 'RT_GROUP_ICON is missing from the EXE'; archive=CArchiveReader(path); assert 'icon.ico' in archive.toc, 'icon.ico is missing from the one-file archive'; print('EXE icon verification passed')"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: MinecraftStructureForge-Windows-x64
          path: dist/MinecraftStructureForge.exe
          if-no-files-found: error
          compression-level: 0
